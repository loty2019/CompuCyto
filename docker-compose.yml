services:
  frontend:
    build:
      context: .
      dockerfile: dashboard_frontend/Dockerfile
      args:
        VITE_API_URL: /
        VITE_PYTHON_CAMERA_URL: /python-api
        VITE_PI_API_URL: /pi-api
    image: cytocore-frontend:local
    container_name: cytocore-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      PI_API_UPSTREAM: ${PI_API_UPSTREAM:-http://192.168.100.1:8000}
    depends_on:
      - nest-backend
      - camera-backend

  nest-backend:
    build:
      context: .
      dockerfile: dashboard_backend/Dockerfile
    image: cytocore-nest-backend:local
    container_name: cytocore-nest-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_PORT: 80
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-cytocore}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-cytocore}
      DATABASE_NAME: ${POSTGRES_DB:-cytocore}
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-before-field-use}
      PYTHON_CAMERA_URL: http://camera-backend:8001
      RASPBERRY_PI_URL: ${PI_API_UPSTREAM:-http://192.168.100.1:8000}
      ALLOWED_ORIGINS: http://cytocore.local,http://localhost,http://127.0.0.1
      IMAGES_PATH: /data/captures
      THUMBNAILS_PATH: /data/thumbnails
    volumes:
      - media-data:/data
    depends_on:
      db:
        condition: service_healthy
      camera-backend:
        condition: service_started

  camera-backend:
    build:
      context: .
      dockerfile: camera_backend/Dockerfile
    image: cytocore-camera-backend:local
    container_name: cytocore-camera-backend
    restart: unless-stopped
    privileged: true
    environment:
      host: 0.0.0.0
      port: 8001
      jwt_secret: ${JWT_SECRET:-change-me-before-field-use}
      allowed_origins: http://cytocore.local,http://localhost,http://127.0.0.1
      image_save_path: /data/captures
      video_save_path: /data/videos
    volumes:
      - media-data:/data
      - /dev:/dev

  db:
    image: postgres:16-alpine
    container_name: cytocore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cytocore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cytocore}
      POSTGRES_DB: ${POSTGRES_DB:-cytocore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  media-data:
